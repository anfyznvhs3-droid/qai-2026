<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 현황 | 제조데이터 프로젝트 대시보드</title>
  <style>
    :root {
      --paper: #f3efe4;
      --ink: #1b1914;
      --muted: #6d655b;
      --line: #d9d1c3;
      --card: #fffdf8;
      --jw: #1f4b3a;
      --ye: #6b3f1f;
      --ys: #1e3a5f;
      --focus: #c4552a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.4 "Malgun Gothic", sans-serif;
    }
    header, main, #gate { max-width: 1280px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: end; padding: 22px 16px 8px; }
    h1 { font-size: 28px; margin: 0; letter-spacing: -0.04em; }
    h2 { font-size: 15px; margin: 0; }
    a { color: var(--ink); }
    .sub { color: var(--muted); margin: 4px 0 0; }
    .kpis, .lanes { display: grid; gap: 12px; padding: 8px 16px 24px; }
    .kpis { grid-template-columns: repeat(4, 1fr); }
    .lanes { grid-template-columns: repeat(3, 1fr); }
    .kpi, .lane, #gate form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .kpi strong, .phase { display: block; font-size: 28px; letter-spacing: -0.04em; }
    .lane.정진우 { border-top: 4px solid var(--jw); }
    .lane.엄예지 { border-top: 4px solid var(--ye); }
    .lane.최연식 { border-top: 4px solid var(--ys); }
    .bar { height: 8px; background: #e6dfd2; border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .bar span { display: block; height: 100%; background: var(--jw); }
    .pill { display: inline-block; border-radius: 99px; padding: 2px 8px; background: #e7f2ea; }
    .pill.stop { background: #f3e4dc; }
    .decision-overview { margin: 0 16px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .decision-overview h2 { font-size: 18px; }
    .decision-overview p { margin: 5px 0; }
    .decision-overview ol { display: grid; gap: 5px; padding-left: 20px; margin-bottom: 0; }
    #gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    #gate[hidden], #app[hidden] { display: none; }
    #gate form { width: min(420px, 100%); display: grid; gap: 10px; }
    input, select, button { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    button { background: var(--ink); color: var(--paper); cursor: pointer; }
    .err { color: var(--focus); min-height: 1.2em; }
    @media (max-width: 900px) {
      .kpis, .lanes { grid-template-columns: 1fr; }
    }
  
/* Q.AI UI standard: spacing and surface, no decorative borders. */
:root { --paper:#f6f7f8; --card:#fff; --ink:#202825; --muted:#64706a; --focus:#23654c; --jw:#23654c; --line:transparent; }
body { background:var(--paper); color:var(--ink); font-family:"Malgun Gothic",system-ui,sans-serif; }
header,main,#gate { max-width:1160px; }
h1 { font-size:28px; font-weight:700; letter-spacing:-.04em; }
h2 { font-size:20px; font-weight:650; }
button,input,select,textarea,fieldset.card,.card,.panel,.collab,.decision,.decision-item,.meter,.lane,.kpi,.decision-overview,#gate form { border:0 !important; }
input,textarea,select { background:#eef1ef; border-radius:6px; }
button { border-radius:6px; }
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible,summary:focus-visible { outline:2px solid #23654c; outline-offset:3px; }
nav.pages { gap:4px; padding-top:8px; }
nav.pages button,nav.pages a { background:transparent !important; border:0 !important; color:var(--muted); padding:10px 16px; }
nav.pages button.on { background:#e2ebe6 !important; color:#174f39 !important; font-weight:700; }
.decision,.collab,.panel { border-radius:10px; padding:24px; }
.decision { background:transparent; padding:8px 0; }
.decision-head { padding:0 0 12px; }
.decision-summary { gap:20px; margin-bottom:20px; }
.decision-summary span { background:none; padding:0; font-size:14px; color:var(--muted); }
.decision-grid { gap:12px; }
.decision-item { background:#fff; border-radius:8px; padding:20px; }
.decision-item.finalist { background:#e4eee8; }
.decision-item.leader:not(.finalist) { background:#f0f4f1; }
.decision-item h3 { font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted); }
.decision-text { font-size:17px; line-height:1.5; margin:6px 0; }
.decision-tags { gap:12px; }
.decision-tags span { border:0; background:none; padding:0; color:var(--muted); font-size:12px; }
.vote-track { display:none; }
.decision-actions { margin-top:14px; }
.decision-actions button { background:#eef1ef; color:var(--ink); padding:7px 12px; }
.decision-actions button[aria-pressed="true"] { background:#23654c; color:#fff; }
.decision-item.awaiting { background:#edf0ee; padding:16px 20px; }
.awaiting .decision-loss,.awaiting .decision-tags,.awaiting .decision-actions { display:none; }
.awaiting .decision-text { font-size:15px; font-weight:400; color:var(--muted); margin-bottom:0; }
.shortlist,.team-fold { border:0 !important; }
.shortlist { padding-top:24px; }
.shortlist-list span { background:#e2ebe6; }
.comparison td,.comparison th { border:0 !important; padding:14px; }
.comparison th { background:#eaf0ec; }
.comparison tr:nth-child(even) td { background:#f4f6f4; }
.chat-dock { background:white; border-radius:10px; }
.chat-dock .topics button { background:#eef1ef; }
.chat-dock .topics button.active { background:#23654c; }
.chat-dock .messages { background:#f3f5f3; }
.message.reply { border:0; background:#f3f6f4; }
.lane { border-top:0 !important; }
.pill,.pill.stop { background:#e8eeea; }
@media(max-width:700px){ .decision-grid { grid-template-columns:1fr; } .decision-head { gap:10px; } .decision-summary { gap:8px 16px; } .decision,.collab,.panel { padding:16px; } nav.pages button { flex:0 1 auto; font-size:14px; } }

</style>
</head>
<body>
  <section id="gate">
    <form id="login">
      <h1>제조데이터 프로젝트 현황</h1>
      <p class="sub">Q.AI · 팀 진행 상황과 다음 작업을 확인합니다.</p>
      <label>내 이름<select id="key"><option>정진우</option><option>엄예지</option><option>최연식</option></select></label>
      <button type="submit">들어가기</button>
      <p id="login-err" class="err"></p>
    </form>
  </section>
  <main id="app" hidden>
    <header>
      <div>
        <h1>제조데이터 프로젝트 현황</h1>
        <p class="sub" id="presence"></p>
      </div>
      <a href="/">프로젝트 보드</a>
    </header>
    <section id="kpis" class="kpis"></section>
    <section id="decision" class="decision-overview"></section>
    <section id="lanes" class="lanes"></section>
  </main>
  <script>
    const seats = ["정진우", "엄예지", "최연식"];
    const phaseBySkill = {
      "kamp-nba": "아이디어",
      "kamp-fusion-ablation": "EDA",
      "kamp-baseline-gbdt": "모델링",
    };
    let source = null;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function filledIdeas(next, owner) {
      const rows = (next.ideas || []).filter((row) => row.owner === owner);
      const done = rows.filter((row) => [row.process, row.event, row.loss].every((part) => String(part || "").trim())).length;
      return { done, total: rows.length || 5 };
    }

    function pairFilled(next) {
      const pair = next.pair || {};
      return [pair.idA, pair.idB].filter((value) => String(value || "").trim()).length;
    }

    function phaseOf(card, history) {
      const written = String(card.phase || "").trim();
      if (written) return { label: written, from: "카드" };
      const last = history[history.length - 1];
      const hits = [...new Set((last?.skills || []).map((name) => phaseBySkill[name]).filter(Boolean))];
      if (hits.length === 1) return { label: hits[0], from: "스킬" };
      return { label: "아직 없음", from: "" };
    }

    function agentLive(card) {
      const at = Date.parse(card.at || "");
      return Number.isFinite(at) && Date.now() - at < 120000;
    }

    function render(next) {
      const topic = String(next.setup?.topic || "").trim();
      const filled = (next.ideas || []).filter((row) => [row.process,row.event,row.loss].every(v=>String(v||"").trim())).length;
      const dataCount = pairFilled(next);
      const runId = String(next.run?.id || "").trim();
      const kpis = [
        ["주제", topic || "없음"],
        ["아이디어", `${filled}/${next.ideas.length}`],
        ["데이터", `${dataCount}/2`],
        ["시작", runId || (next.started ? "시작됨" : "시작 전")],
      ];
      document.getElementById("kpis").innerHTML = kpis.map(([name, value]) => `<article class="kpi"><h2>${esc(name)}</h2><strong>${esc(value)}</strong></article>`).join("");
      document.getElementById("lanes").innerHTML = seats.map((seat) => {
        const card = (next.cards || {})[seat] || {};
        const history = ((next.env || {})[seat] || []).filter((row) => row && row.id);
        const last = history[history.length - 1] || {};
        const phase = phaseOf(card, history);
        const score = seat === "최연식" ? { done: dataCount, total: 2 } : filledIdeas(next, seat);
        const width = Math.round((score.done / score.total) * 100);
        const live = agentLive(card);
        const where = [last.tool, last.ide].filter(Boolean).join(" · ");
        const skills = (last.skills || []).join(", ");
        return `<article class="lane ${esc(seat)}">
          <h2>${esc(seat)}</h2>
          <span class="phase">${esc(phase.label)}</span>
          <p class="sub">${phase.from ? esc(phase.from) : "단계 없음"} · <span class="pill ${live ? "" : "stop"}">${live ? "최근 보고" : "최근 보고 없음"}</span></p>
          <div class="bar"><span style="width:${width}%"></span></div>
          <p class="sub">${score.done}/${score.total}</p>
          <p>${esc(card.now || "지금 없음")}</p>
          <p class="sub">막힘 ${esc(card.blocked || "없음")}</p>
          <p class="sub">다음 ${esc(card.next || "없음")}</p>
          <p class="sub">${esc(where || "도구 없음")}${last.id ? ` · ${esc(last.id)}` : ""}</p>
          <p class="sub">${esc(skills || "스킬 없음")}</p>
        </article>`;
      }).join("");
      renderDecision(next);
    }

    function renderDecision(next) {
      const state = next.decision || {};
      const votes = state.votes || {};
      const voters = seats.filter((seat) => Array.isArray(votes[seat]) && votes[seat].length).length;
      const box = document.getElementById("decision");
      box.replaceChildren();
      const heading = document.createElement("h2");
      heading.textContent = "20 → 3 회의 결정판";
      const participation = document.createElement("p");
      participation.className = "sub";
      participation.textContent = "투표 참여 " + voters + "/3명 · 후보 " + (state.finalists || []).length + "/3 · 회의 초안";
      box.append(heading, participation);
      const rows = (next.ideas || []).map((idea) => ({
        idea,
        count: seats.filter((seat) => Array.isArray(votes[seat]) && votes[seat].includes(idea.id)).length,
      })).filter((row) => row.count > 0).sort((a, b) => b.count - a.count || a.idea.id.localeCompare(b.idea.id));
      if (rows.length) {
        const cutoff = rows.length >= 3 ? rows[2].count : 1;
        const list = document.createElement("ol");
        for (const row of rows.filter((item) => item.count >= cutoff)) {
          const item = document.createElement("li");
          item.textContent = row.idea.id + " · " + (row.idea.process || row.idea.event || "내용 입력 대기") + " · " + row.count + "표";
          list.append(item);
        }
        box.append(list);
      } else {
        const waiting = document.createElement("p");
        waiting.textContent = "아직 투표가 없습니다.";
        box.append(waiting);
      }
      const shortlist = document.createElement("p");
      shortlist.textContent = "사람이 담은 후보: " + ((state.finalists || []).join(", ") || "아직 없음");
      box.append(shortlist);
    }

    function renderPresence(payload) {
      document.getElementById("presence").textContent = seats.map((seat) => `${seat} ${payload[seat] ? "접속" : "없음"}`).join(" · ");
    }

    function connect() {
      if (source) source.close();
      source = new EventSource("/events");
      source.addEventListener("board", (event) => render(JSON.parse(event.data)));
      source.addEventListener("presence", (event) => renderPresence(JSON.parse(event.data)));
      source.onerror = () => {};
    }

    function showApp() {
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;
      connect();
    }

    document.getElementById("login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: document.getElementById("key").value }),
      });
      if (!response.ok) {
        document.getElementById("login-err").textContent = "이름을 선택해 다시 들어오세요.";
        return;
      }
      const board = await (await fetch("/api/board")).json();
      render(board);
      showApp();
    });

    fetch("/api/board").then(async (response) => {
      if (!response.ok) return;
      render(await response.json());
      showApp();
    });
  </script>
</body>
</html>
